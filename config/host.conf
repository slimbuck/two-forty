# Game loaded automatically whenever the Pi boots or the host restarts.
# Use "launcher" to boot to the game-selection menu instead.
boot_game=launcher

# Default GP2040 Generic SNES-style bindings (Linux evdev codes).
# D-pad axes, Y jump, B dash, Start confirm, Select menu.
bind_left=abs:16:-1
bind_right=abs:16:1
bind_up=abs:17:-1
bind_down=abs:17:1
bind_jump=key:304
bind_dash=key:305
bind_confirm=key:313
bind_menu=key:312
