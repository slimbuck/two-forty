# Game loaded automatically whenever the Pi boots or the host restarts.
# Use "launcher" to boot to the game-selection menu instead.
boot_game=launcher

# Default GP2040 Generic SNES-style bindings (Linux evdev codes).
# D-pad axes, Y jump, B dash/confirm, Select menu.
bind_left=abs:16:-1
bind_right=abs:16:1
bind_up=abs:17:-1
bind_down=abs:17:1
bind_jump=key:304
bind_dash=key:305
bind_confirm=key:305
bind_menu=key:312

# Input settings wizard and CRT-safe viewport.
input_version=2
safe_x=16
safe_y=12
key_left=key:105
key_right=key:106
key_up=key:103
key_down=key:108
key_jump=key:44
key_dash=key:45
key_confirm=key:28
key_menu=key:1
