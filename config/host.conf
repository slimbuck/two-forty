# Game loaded automatically whenever the Pi boots or the host restarts.
# Use "launcher" to boot to the game-selection menu instead.
boot_game=phosphor-run

# Default SNES-style controller bindings (Linux evdev codes).
# D-pad axes, B jump, Y dash, Start confirm, Select menu.
bind_left=abs:16:-1
bind_right=abs:16:1
bind_up=abs:17:-1
bind_down=abs:17:1
bind_jump=key:304
bind_dash=key:308
bind_confirm=key:315
bind_menu=key:314
